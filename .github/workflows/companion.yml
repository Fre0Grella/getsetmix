name: Companion

# Test, build and release gsm-companion (companion/).
#
# Releases are automated from companion/VERSION: a push to main that leaves
# VERSION at a number with no `companion-vX.Y.Z` tag yet builds Windows +
# macOS and publishes that release. Pushing a `companion-v*` tag releases the
# tagged commit directly (a pre-release when the version carries a suffix,
# e.g. companion-v0.2.0-rc.1). The `companion-` prefix keeps these tags apart
# from the server's semantic-release `vX.Y.Z` tags.

on:
  push:
    branches: [main]
    tags: ["companion-v*"]
    paths: ["companion/**", ".github/workflows/companion.yml"]
  pull_request:
    paths: ["companion/**", ".github/workflows/companion.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: companion

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      # SQLCipher is compiled in through cgo, so Windows needs a C compiler.
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Vet and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go vet ./... && go test ./...
      - name: Vet and test
        if: runner.os != 'Windows'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#companion-v}"
            release=true
          else
            version="$(tr -d '[:space:]' < VERSION)"
            if [ "$GITHUB_REF" = refs/heads/main ] && ! git rev-parse -q --verify "refs/tags/companion-v$version" >/dev/null; then
              release=true
            else
              release=false
            fi
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version release=$release prerelease=$prerelease"
          {
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [test, plan]
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: gsm-companion-windows-x64.zip
          - os: macos-latest
            asset: gsm-companion-macos.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc zip
          path-type: inherit

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          flags="-s -w -X main.version=$VERSION -extldflags=-static"
          mkdir -p dist
          go build -trimpath -ldflags "$flags" -o dist/gsm-companion.exe ./cmd/gsm-companion
          # Same program on the GUI subsystem: the launcher and autostart use
          # it so no console window flashes up.
          go build -trimpath -ldflags "$flags -H=windowsgui" -o dist/gsm-companionw.exe ./cmd/gsm-companion
          ./dist/gsm-companion.exe version
          cp README.md dist/
          (cd dist && zip -9 ../${{ matrix.asset }} gsm-companion.exe gsm-companionw.exe README.md)

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CGO_ENABLED: "1"
        run: |
          flags="-s -w -X main.version=$VERSION"
          mkdir -p dist
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "$flags" -o dist/arm64 ./cmd/gsm-companion
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$flags" -o dist/amd64 ./cmd/gsm-companion
          lipo -create -output dist/gsm-companion dist/arm64 dist/amd64
          ./dist/gsm-companion version
          cp README.md dist/
          tar -C dist -czf ${{ matrix.asset }} gsm-companion README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: companion/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gsm-companion-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: gsm-companion ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: false   # keep the server's release as the repo's "latest"
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            **gsm-companion** imports the tracks GetSetMix delivers straight into
            your Rekordbox collection, into a `GetSetMix` playlist.

            - **Windows**: `gsm-companion-windows-x64.zip` (`gsm-companion.exe` +
              the windowless `gsm-companionw.exe`)
            - **macOS** (Apple silicon + Intel): `gsm-companion-macos.tar.gz`

            Unpack it somewhere permanent, close Rekordbox, then run
            `gsm-companion setup` and `gsm-companion install`.
            Full guide: [companion/README.md](https://github.com/${{ github.repository }}/blob/main/companion/README.md).
