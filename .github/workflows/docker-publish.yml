name: Publish image

# Rolling images for the main branch. Versioned, immutable image tags
# (:1.2.3, :1.2, :1) are built by the Release workflow on each semantic-release
# tag — see .github/workflows/release.yml.
#
# Also rebuilt weekly: YouTube keeps changing what yt-dlp has to do, and an
# image that is a few months old starts failing downloads with HTTP 403. Each
# build resolves the newest yt-dlp and passes it as a build arg, which busts
# the pip layer in the GHA cache (otherwise the cached, stale install would be
# reused forever).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the newest yt-dlp
        id: ytdlp
        run: echo "version=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main -> :latest and :main
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
