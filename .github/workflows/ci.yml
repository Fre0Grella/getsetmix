name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Which parts a pull request touches. The app's tests, browser tests and
  # image build are skipped when every changed file is one they never read:
  # the companion (its own workflow tests it), the docs, the site, and the
  # files of other workflows. Anything else, or a push to main, runs them all.
  # lint always runs: its ratchet covers the companion's duplication too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(git diff --name-only "$BASE"...HEAD | grep -vE '^(companion/|docs/|site/|\.github/workflows/(companion|pages|commitlint)\.yml$|commitlint\.config\.mjs$|\.pre-commit-config\.yaml$|CLAUDE\.md$|README\.md$)' || true)
          if [ -n "$others" ]; then
            echo "The app's jobs run for:"; echo "$others"
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app's jobs read changed: they are skipped."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tool versions are pinned in requirements-dev.txt: a new release can find
      # more, which would change the counts below with no code change.
      - run: pip install -r requirements-dev.txt
      # The UI has no build step, so nothing else would notice a syntax error.
      # Its files are ES modules: Node 22 reads import/export in a .js file.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in app/static/*.js; do node --check "$f"; done
      # The ratchet: ruff, pyright, import-linter (pyproject.toml) and jscpd
      # duplication. Each count must stay at or below its ceiling in
      # ratchets.json. To LOWER a ceiling, edit that number in the same PR that
      # improves the code (the script prints "lower the ceiling to N" when a
      # count has dropped). Never raise one: fix the new finding instead.
      - run: python scripts/ratchet.py

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      # playwright is installed, so tests/ui would be collected here; the ui job
      # runs them, with a browser.
      - run: python -m pytest tests/ -v --ignore=tests/ui --cov=app --cov-report=term --cov-report=json
      # Coverage may rise, never fall: its floor is "coverage_percent_floor" in
      # ratchets.json (the script says when to raise it).
      - run: python scripts/ratchet.py coverage

  ui:
    # Browser smoke tests (tests/ui): the real app on a free port, in Chromium.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/ui -v

  docker-build:
    # PR safety net: make sure the image still builds (no push)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
