name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as .pre-commit-config.yaml: newer ruff releases widen the
      # default rule set, which would fail CI with no code change.
      - run: pip install ruff==0.6.9
      - run: ruff check app tests run_local.py
      # The UI has no build step, so nothing else would notice a syntax error.
      - run: for f in app/static/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests/ -v

  docker-build:
    # PR safety net: make sure the image still builds (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
